name: CubeHAOS public free image build

on:
  push:
    branches:
      - feature/cubehaos-public-build-20261117
    paths:
      - 'cubehaos/**'
      - '.github/workflows/cubehaos-public-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Cube source, script syntax and fail-closed validators
        working-directory: cubehaos
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          for sh in scripts/*.sh; do bash -n "$sh"; done
          python3 -m compileall -q scripts tests

  build-image:
    needs: source-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free space for the Buildroot cross-compilation
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache /usr/local/share/powershell
          df -h .
      - name: Check out the exact pinned OS and Cube board sources
        working-directory: cubehaos
        env:
          WORK: ${{ runner.temp }}/cubehaos-build
        run: bash ./scripts/bootstrap.sh "$WORK"
      - name: Verify/cache U-Boot 2026.01 and dry-run HAOS patch (zero fuzz)
        working-directory: cubehaos
        env:
          WORK: ${{ runner.temp }}/cubehaos-build
          CACHE_DIR: ${{ runner.temp }}/hassos-cache
        run: |
          set -euo pipefail
          # Buildroot's pinned Cube defconfig uses BR2_DL_DIR="/cache/dl".
          # Share the verified source with the later Docker build to avoid the
          # unreachable ftp.denx.de server and repeat downloads.
          archive="$CACHE_DIR/dl/uboot/u-boot-2026.01.tar.bz2"
          patch_tree="$RUNNER_TEMP/uboot-patch-preflight"
          # SHA-256 of the official U-Boot release archive, recorded by Buildroot
          # in package/uboot-tools/uboot-tools.hash (2026.01).
          expected_sha256="b60d5865cefdbc75da8da4156c56c458e00de75a49b80c1a2e58a96e30ad0d54"
          mkdir -p "$(dirname "$archive")" "$patch_tree"
          sources=(
            'https://sources.buildroot.net/uboot/u-boot-2026.01.tar.bz2'
            'https://u-boot.osuosl.org/u-boot-2026.01.tar.bz2'
            'https://ftp.denx.de/pub/u-boot/u-boot-2026.01.tar.bz2'
            'https://mirror.nju.edu.cn/buildroot/uboot-tools/u-boot-2026.01.tar.bz2'
          )
          verified=false
          for url in "${sources[@]}"; do
            echo "Checking U-Boot release archive from $url"
            rm -f "${archive}.part"
            if curl --fail --location --silent --show-error \
                 --connect-timeout 10 --max-time 150 \
                 --output "${archive}.part" "$url"; then
              if printf '%s  %s\n' "$expected_sha256" "${archive}.part" | sha256sum --check --status; then
                mv "${archive}.part" "$archive"
                verified=true
                break
              fi
              echo "Rejecting source archive with incorrect SHA-256 from $url" >&2
            fi
          done
          rm -f "${archive}.part"
          if [ "$verified" != true ]; then
            echo "No SHA-256-verified U-Boot 2026.01 release archive available" >&2
            exit 1
          fi
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check
          tar -xjf "$archive" --strip-components=1 -C "$patch_tree" \
            u-boot-2026.01/cmd/Makefile u-boot-2026.01/cmd/Kconfig
          patch --batch --fuzz=0 --dry-run -p1 -d "$patch_tree" \
            -i "$WORK/operating-system/buildroot-external/patches/uboot/0001-CMD-read-string-from-fileinto-env.patch"
          echo "Verified U-Boot 2026.01 cached for Buildroot; patch applies with zero fuzz."
      - name: Build full Home Assistant OS Cube image and inspect GPT / RAUC presence
        working-directory: cubehaos
        env:
          WORK: ${{ runner.temp }}/cubehaos-build
          CACHE_DIR: ${{ runner.temp }}/hassos-cache
        run: bash ./scripts/build.sh "$WORK"
      - name: Validate candidate release identity
        if: success()
        working-directory: cubehaos
        env:
          WORK: ${{ runner.temp }}/cubehaos-build
        run: |
          python3 scripts/release_gate.py "$WORK/operating-system/output/images" --help || true
          test -s "$WORK/operating-system/output/images/cube-release-inspection.json"
      - name: Upload candidate disk image, RAUC bundle and inspection log
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cubehaos-NOT-HARDWARE-TESTED-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cubehaos-build/operating-system/output/images/haos_cube2v0eu-*.img.xz
            ${{ runner.temp }}/cubehaos-build/operating-system/output/images/haos_cube2v0eu-*.raucb
            ${{ runner.temp }}/cubehaos-build/operating-system/output/images/cube-release-inspection.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
