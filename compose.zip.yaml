name: gymnotfound-zip
services:
  db:
    image: mariadb:11.4@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-test-only
      MARIADB_ROOT_PASSWORD: local-test-root-only
    volumes: ['zip_db:/var/lib/mysql']
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 30
  wordpress:
    image: wordpress:6.8.3-php8.3-apache@sha256:30bff39330d1693b0ce13d32fc9b7bb67193064f040b7d60d3494e136fa599d4
    ports: ['127.0.0.1:8081:80']
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-test-only
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define('GNF_CA_BUNDLE', '/run/gnf-ca.crt');
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', true);
        if (getenv('HTTPS_PROXY')) {
          $$gnf_proxy = parse_url(getenv('HTTPS_PROXY'));
          define('WP_PROXY_HOST', $$gnf_proxy['host']);
          define('WP_PROXY_PORT', $$gnf_proxy['port'] ?? 8080);
          define('WP_PROXY_BYPASS_HOSTS', 'localhost,127.0.0.1,db');
        }
    volumes:
      - zip_wp:/var/www/html
      - /etc/ssl/certs/ca-certificates.crt:/run/gnf-ca.crt:ro
      - ./tests/mu-cloud-trust.php:/var/www/html/wp-content/mu-plugins/gnf-cloud-trust.php:ro
    depends_on:
      db: {condition: service_healthy}
  cli:
    image: wordpress:cli-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    user: '33:33'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-test-only
      WORDPRESS_CONFIG_EXTRA: |
        define('GNF_CA_BUNDLE', '/run/gnf-ca.crt');
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', true);
        if (getenv('HTTPS_PROXY')) {
          $$gnf_proxy = parse_url(getenv('HTTPS_PROXY'));
          define('WP_PROXY_HOST', $$gnf_proxy['host']);
          define('WP_PROXY_PORT', $$gnf_proxy['port'] ?? 8080);
          define('WP_PROXY_BYPASS_HOSTS', 'localhost,127.0.0.1,db');
        }
    volumes:
      - zip_wp:/var/www/html
      - /etc/ssl/certs/ca-certificates.crt:/run/gnf-ca.crt:ro
      - ./tests/mu-cloud-trust.php:/var/www/html/wp-content/mu-plugins/gnf-cloud-trust.php:ro
    depends_on:
      db: {condition: service_healthy}
volumes:
  zip_db:
  zip_wp:
