<script>
(()=>{'use strict';
const KEY='ikke-trening-gamification-v41';
const now=()=>new Date().toISOString();
const STEPS=['Første glimt','Det lille smauet','Den gamle døren','En stille hage','Veien mot havet','Utsikten'];
const reasons=[['bored','Det er bare kjedelig'],['start','Kommer ikke i gang'],['time','Har ikke tid'],['tired','Lite overskudd'],['social','Vil ha selskap'],['restart','Har falt ut'],['discomfort','Føles ubehagelig']];
function defaults(){return {view:'today',reason:'bored',mode:'opplevelse',minutes:'5',feel:'ok',phase:'offer',goal:'Mer overskudd til ting jeg liker',mascot:true,group:false,simulated:false,session:[],plans:[],lastVisit:now(),toast:'',paused:false};}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.session)&&Array.isArray(x.plans))return {...defaults(),...x,view:'today',phase:'offer',toast:'',simulated:false};}catch(e){}return defaults();}
let s=load();
const gap=(Date.now()-Date.parse(s.lastVisit||now()))/(864e5);
if(gap>7){s.toast='Velkommen tilbake. Det er ingen tapte rekker eller noe du må ta igjen.';}
const $=id=>document.getElementById(id);
const e=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=(h)=>h;
const doneCount=()=>s.session.length;
const minutesTotal=()=>s.session.reduce((a,x)=>a+Number(x.minutes||0),0);
const progressCount=()=>Math.min(doneCount(),STEPS.length);
const modeNames={opplevelse:'Nysgjerrig',enkelt:'Bare få det gjort',sammen:'Sammen med noen'};
const reasonName=()=>reasons.find(x=>x[0]===s.reason)?.[1]||'En enkel start';
function offer(){
 if(s.reason==='time') return {kind:'plan',tag:'En faktisk anledning',title:'Finn plass, ikke motivasjon',desc:'Du trenger ikke presse enda en oppgave inn i en full kalender. Velg et tidspunkt der bevegelse kan passe inn, og en reserveløsning.',first:'Finn en vanlig hendelse, som å være ferdig med middagen.',duration:0,why:'COM-B: Før handling må det finnes reell anledning. Planlegging er ikke gjennomføring.'};
 if(s.reason==='discomfort') return {kind:'gentle',tag:'Trygg og valgfri støtte',title:'Endre rammene først',desc:'Velg en roligere eller mer privat aktivitet, eller ta en pause. Ved smerter, uvanlige symptomer eller begrensninger bør du få individuelt tilpassede råd.',first:'Beskriv hva ved situasjonen som kjennes ubehagelig.',duration:0,why:'Affekt og kapasitet. Appen er ikke en medisinsk vurdering.'};
 if(s.reason==='social'||s.mode==='sammen') return {kind:'social',tag:'Små fellesskap',title:'Gjør noe sammen – på hver deres måte',desc:'Inviter en du kjenner til et lite felles oppdrag denne uka. Dere trenger ikke gå samtidig eller like langt.',first:'Finn én person du har lyst til å spørre.',duration:0,why:'Frivillig støtte og tilhørighet. Ingen offentlige rangeringer og ingen deling uten samtykke.'};
 if(s.reason==='tired') return {kind:'small',tag:'På dagens premisser',title:'Rolig er også lov',desc:'Et lite, rolig avbrekk hvis du vil. Du kan også velge hvile. En pause gir ingen straff i spillet.',first:'Velg et sted der det er lett å bevege seg litt.',duration:2,why:'Lav terskel og kapasitetstilpasning. Ikke press ved sykdom eller plager.'};
 if(s.reason==='restart') return {kind:'small',tag:'Myk gjenstart',title:'Du har ikke falt tilbake til null',desc:'Fortsett med noe lite som tidligere var mulig. Reisen din ligger akkurat der du forlot den.',first:'Velg én tidligere overkommelig handling.',duration:2,why:'Gjenstart uten tap og en justert reserveplan.'};
 if(s.mode==='enkelt') return {kind:'routine',tag:'Ingen treningsglede kreves',title:'En liten oppgave. Så ferdig.',desc:'Velg én nyttig liten oppgave. Bruk noen minutter i bevegelse mens du gjør den. Ingen fortelling, ingen prestasjon.',first:'Finn én konkret ting du allerede ønsker gjort.',duration:Number(s.minutes),why:'Autonomi: Brukeren trenger ikke oppleve aktiviteten som morsom for å gjennomføre.'};
 if(s.reason==='start')return {kind:'experience',tag:'Første kapittel',title:'Bare begynn med første spor',desc:'Du trenger ikke bestemme deg for en hel tur. Se deg rundt, legg merke til én uventet detalj og velg selv om du vil fortsette.',first:'Reis deg i ditt eget tempo og velg retning.',duration:Number(s.minutes),why:'Oppstartfriksjon: Én enkel handling før hele aktiviteten.'};
 return {kind:'experience',tag:'Et lite eventyr',title:'Finn noe du ikke har sett før',desc:'En liten oppdagelsesrunde, inne eller ute. Legg merke til et sted, et mønster eller en lyd du vanligvis overser. Bevegelsen åpner neste kapittel.',first:'Velg en dør eller et sted i nærheten.',duration:Number(s.minutes),why:'Nysgjerrighet og opplevelse er belønningen; minutter registreres separat.'};
}
function mascotSVG(variant='normal'){
 let calm=variant==='rest',won=variant==='won';
 return `<svg class="mascot-illustration ${calm?'sleep':''} ${won?'won':''}" viewBox="0 0 240 230" role="img" aria-label="NIM – en vennlig, liten lysende følgesvenn"><defs><linearGradient id="bodyColor" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#dffce5"/><stop offset=".52" stop-color="#a9dfc6"/><stop offset="1" stop-color="#77bda8"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff9dd"/><stop offset="1" stop-color="#f5ba73"/></linearGradient></defs><ellipse cx="119" cy="208" rx="62" ry="12" fill="#082d23" opacity=".18"/><g transform="translate(3 2)"><path d="M57 109C27 89 18 121 41 133L60 142" fill="#91cbb4"/><path d="M173 107C207 87 218 120 187 134L172 139" fill="#86bfa8"/><path d="M75 182Q69 216 86 212L103 199M144 199L166 214Q180 214 165 180" stroke="#64ab96" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M121 39C90 33 58 56 49 96C42 130 45 170 70 186C94 204 146 204 171 184C197 163 199 127 188 90C177 53 153 40 121 39Z" fill="url(#bodyColor)" stroke="#e4ffed" stroke-width="2"/><path d="M67 103C73 72 95 58 116 55" fill="none" stroke="#fafff7" stroke-width="9" opacity=".55" stroke-linecap="round"/><ellipse cx="91" cy="121" rx="7.5" ry="10.5" fill="#183e34" class="eye"/><ellipse cx="145" cy="121" rx="7.5" ry="10.5" fill="#183e34" class="eye"/>${calm?'<path d="M85 123q8-8 16 0M138 123q8-8 16 0" stroke="#183e34" stroke-width="3" fill="none"/>':'<path d="M113 147Q119 152 125 147" fill="none" stroke="#2a6555" stroke-width="3.7" stroke-linecap="round"/>'}<ellipse cx="77" cy="141" rx="12" ry="6" fill="#ffa47b" opacity=".45"/><ellipse cx="159" cy="141" rx="12" ry="6" fill="#ffa47b" opacity=".45"/><path d="M122 38L121 20" stroke="#b0ddbd" stroke-width="6" stroke-linecap="round"/><circle cx="121" cy="16" r="13" fill="url(#shine)"/><path d="M116 16l4 4 8-10" fill="none" stroke="#ab7138" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="196" cy="47" r="4" fill="#f7da99"/><circle cx="30" cy="72" r="3" fill="#d6fff2"/></svg>`;
}
function hero(){let bubble=s.paused?'En pause er helt i orden.':(s.toast.includes('registrert')?'Et nytt lite glimt!':s.reason==='restart'?'Du er fortsatt på reisen.':s.reason==='time'?'Vi finner plass først.':'Kanskje vi skal oppdage noe?');return `<section class="hero" id="i-dag"><div class="hero-copy"><div class="eyebrow">EN LITT ANNEN TYPE AKTIVITETSAPP</div><h1>Mer lyst til livet.<br/>Mindre <em>treningsmas.</em></h1><p class="lead">Et lite spill som hjelper deg med det som egentlig er vanskelig: å komme i gang, ha en grunn til å fortsette – og begynne igjen.</p><div class="minibadges"><span class="minibadge">✧ Ingen tapte rekker</span><span class="minibadge">◎ Ditt tempo</span><span class="minibadge">◈ Valgfrie venner</span></div></div><div class="companion-panel"><span class="halo"></span><span class="halo two"></span><div class="land secondary"></div><div class="land"></div>${s.mascot?`<div class="speech">${e(bubble)}</div><div class="companion-stage">${mascotSVG(s.paused?'rest':s.toast.includes('registrert')?'won':'normal')}</div><div class="companion-caption">NIM · DIN FRIVILLIGE FØLGESVENN</div>`:`<div class="companion-stage" style="text-align:center;color:#f4efe4;font-size:27px;font-weight:780;letter-spacing:-.03em">Ett lite steg.<br/>I din retning.</div><div class="companion-caption">MASKOTEN ER SLÅTT AV</div>`}</div></section>`;}
function today(){const o=offer();let chapter=STEPS[Math.min(progressCount(),5)];return `${hero()}${s.toast?`<div class="toast" role="status">${e(s.toast)}</div>`:''}<div class="deck"><div class="stack"><section class="card"><div class="eyebrow">01 · VI STARTER MED VIRKELIGHETEN</div><h2>Hva står i veien i dag?</h2><p class="muted sm">Velg det som passer best. Du kan endre deg fra dag til dag.</p><div class="problem-list">${reasons.map(([key,title])=>`<button class="choice ${s.reason===key?'active':''}" data-reason="${key}" type="button" aria-pressed="${s.reason===key}"><b aria-hidden="true">${s.reason===key?'✓':'○'}</b>${e(title)}</button>`).join('')}</div><div class="divider"></div><p class="section-label">Hva slags hjelp liker du?</p><div class="inline-tools">${Object.entries(modeNames).map(([k,n])=>`<button type="button" class="mode-btn ${s.mode===k?'active':''}" data-mode="${k}" aria-pressed="${s.mode===k}">${e(n)}</button>`).join('')}</div></section><section class="quest" id="quest"><header><span class="pill gold">${e(o.tag)}</span>${o.duration?`<span class="pill">${o.duration} min som forslag</span>`:''}</header>${s.phase==='offer'?`<h2>${e(o.title)}</h2><p>${e(o.desc)}</p><div class="first-step"><b>DIN ENKLE START</b>${e(o.first)}</div><div class="btn-row">${o.kind==='plan'?`<button class="btn" data-action="plan" type="button">Finn en anledning →</button>`:o.kind==='social'?`<button class="btn" data-action="friends" type="button">Se vennemulighetene →</button>`:o.kind==='gentle'?`<button class="btn" data-action="rest" type="button">Velg en pause</button><button class="btn ghost" data-action="plan" type="button">Planlegg noe skånsomt</button>`:`<button class="btn" data-action="start" type="button">Jeg prøver dette →</button><button class="btn ghost" data-action="plan" type="button">Lag heller en avtale</button>`}</div><button class="small-control" data-action="why" type="button">Hvorfor dette forslaget? ${s.showWhy?'↑':'↓'}</button>${s.showWhy?`<div class="quest-note">${e(o.why)} Forslaget er en produktidé, ikke en bevist personlig motivasjonsmetode.</div>`:''}`:s.phase==='started'?`<h2>Finn første lille øyeblikk.</h2><p>${e(o.first)} Du kan stoppe når du vil. Ingenting registreres automatisk.</p><div class="first-step"><b>DETTE ER IKKE EN KONKURRANSE</b>Ta hensyn til kroppen og hverdagen. Ved smerter eller uvanlige symptomer: stopp og søk råd ved behov.</div><div class="btn-row"><button class="btn" data-action="report" type="button">Jeg gjorde noe →</button><button class="btn ghost" data-action="stop" type="button">Jeg stoppet</button></div>`:s.phase==='report'?`<h2>Hvordan gikk det?</h2><p>Kun tid du faktisk har vært i aktivitet skal registreres.</p><div class="section-label">Minutter du selv anslår</div><div class="number-buttons">${[2,5,10,15,20].map(n=>`<button class="time-chip ${Number(s.minutes)===n?'active':''}" data-minute="${n}" type="button">${n} min</button>`).join('')}</div><div class="section-label">Hvordan opplevdes det?</div><div class="feedback">${[['bra','Kunne gjort igjen'],['ok','Helt greit'],['negativ','Ikke for meg']].map(([k,v])=>`<button class="mode-btn ${s.feel===k?'active':''}" data-feel="${k}" type="button">${e(v)}</button>`).join('')}</div><div class="btn-row"><button class="btn" data-action="save-report" type="button">Registrer det jeg gjorde</button><button class="btn ghost" data-action="back" type="button">Tilbake</button></div>`:s.phase==='plan'?`<h2>Et tidspunkt som faktisk passer.</h2><p>En avtale gir ikke spillpoeng. Det er aktiviteten som teller.</p><label class="section-label" for="cue">Når kan det være realistisk?</label><select id="cue" class="select" style="width:100%;padding:12px;border-radius:12px;border:1px solid #a6c6b8;background:white;color:#234c3d;margin:7px 0 12px"><option>Etter frokost</option><option selected>Etter middag</option><option>Ved en kort pause</option><option>I morgen formiddag</option></select><div class="first-step"><b>RESERVEPLAN</b>Hvis dette tidspunktet ikke passer, kan du prøve en enklere handling en annen dag.</div><div class="btn-row"><button class="btn" data-action="save-plan" type="button">Lagre avtalen</button><button class="btn ghost" data-action="back" type="button">Tilbake</button></div>`:''}<div class="quest-note">Det er lov å velge noe annet, og det er lov å la være.</div></section></div><aside class="rightcolumn"><section class="card map-card"><div class="eyebrow">02 · DIN LILLE VERDEN</div><h3>Et nytt glimt for hver gjennomføring</h3><p class="sm muted">Små deler av et kart blir synlige når du registrerer en gjennomført aktivitet. Poengene er bare en leken markering.</p><div class="waypoints" aria-label="${progressCount()} av 6 små oppdagelser">${STEPS.map((x,i)=>`<div class="waypoint ${i<progressCount()?'reached':''}" title="${e(x)}" aria-label="${i<progressCount()?'Åpnet: ':'Ikke åpnet: '}${e(x)}">${i<progressCount()?'✦':'·'}</div>`).join('')}</div><div class="map-track" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="${progressCount()}" aria-label="Oppdagelsesreise"><span style="width:${(progressCount()/6)*100}%"></span></div><div class="form-row" style="justify-content:space-between"><span class="sm muted">${progressCount()} / 6 oppdagelser</span><span class="tiny-orbit">${doneCount()} gjennomføringer</span></div><div class="chapter"><strong>${progressCount()?'Siste funn: '+e(STEPS[progressCount()-1]):'Neste funn: '+e(STEPS[0])}</strong><p>${progressCount()?'Du har åpnet et lite kapittel. Det er din opplevelse, ikke en helsemåling.':'Første glimt låses opp når du registrerer en virkelig gjennomføring.'}</p></div><div class="btn-row"><button type="button" class="btn secondary compact" data-view="journey">Utforsk reisen →</button></div></section><section class="card help-card"><div class="eyebrow">IKKE ENDA EN PRESS-APP</div><h3>Ingen dårlig samvittighet.</h3><p class="sm muted">NIM mister ikke energi, og du mister ikke samlingen din når du tar pause. Du kan skjule figuren helt.</p><button type="button" class="btn outline compact" data-view="options">Mine valg →</button></section></aside></div><footer class="footer-note">Konseptprototype · Lagrer data lokalt i denne nettleseren · Ikke helserådgivning · Ingen ekte varsler eller automatisk aktivitetsmåling.</footer>`;}
function journey(){return `<div class="full-header"><div class="eyebrow">DITT EGET LILLE EVENTYR</div><h1>Oppdag noe, ikke bare tell skritt.</h1><p class="intro muted">Små fortellinger kan gi aktivitet en annen mening. Men fremgangen i spillet er ikke det samme som dokumentert helseeffekt.</p></div><div class="layout-two"><section class="card"><h2>Ditt kart</h2><p class="muted sm">Du er aldri tilbake på null, heller ikke etter en lang pause.</p><div class="waypoints" style="margin:20px 0">${STEPS.map((x,i)=>`<div class="waypoint ${i<progressCount()?'reached':''}" title="${e(x)}">${i<progressCount()?'✦':String(i+1)}</div>`).join('')}</div><div class="map-track"><span style="width:${(progressCount()/6)*100}%"></span></div><div class="divider"></div><h3>${progressCount()?'Et lite kapittel er åpnet':'Reisen starter når du vil'}</h3><p class="sm muted">${progressCount()?`Du har sett ${progressCount()} av de seks første stoppene. Neste kapittel kan åpnes med en ny registrert aktivitet.`:'Den første registrerte aktiviteten åpner kapittel 1. Ingen frist.'}</p><div class="divider"></div><h3>Det som faktisk er registrert</h3><div class="kpi-row"><div class="kpi"><strong>${doneCount()}</strong><span>Gjennomførte handlinger</span></div><div class="kpi"><strong>${minutesTotal()}</strong><span>Selvrapporterte minutter</span></div><div class="kpi"><strong>${s.plans.length}</strong><span>Avtaler – ikke aktivitet</span></div></div><div class="btn-row"><button class="btn" type="button" data-view="today">Til dagens forslag →</button></div></section><aside class="stack"><section class="card"><h3>Et oppdrag trenger ikke være sport</h3><p class="sm muted">Et nytt sted, en praktisk oppgave, en lydfortelling eller en tur sammen med noen. Du får velge hva som har verdi for deg.</p><p class="fine">Et kort oppdrag kan hjelpe deg å starte. På sikt kreves mer samlet aktivitet og tilpasset styrke for å nå vanlige helseanbefalinger.</p></section><section class="card"><h3>Dine siste registreringer</h3>${s.session.length?`<ul class="activity-list">${s.session.slice(-6).reverse().map(x=>`<li><span><b>${e(x.title)}</b><small>${new Date(x.time).toLocaleDateString('nb-NO')} · ${e(x.feel==='bra'?'Greit å gjenta':x.feel==='negativ'?'Ikke ønsket igjen':'Gikk greit')}</small></span><b>${x.minutes} min</b></li>`).join('')}</ul>`:'<div class="notebox">Du har ikke registrert aktivitet ennå.</div>'}</section></aside></div>`;}
function together(){const fromYou=Math.min(3,doneCount());const demoOthers=s.simulated?2:0;const sum=Math.min(6,fromYou+demoOthers);const message='Har du lyst til å prøve en liten aktivitet sammen denne uka? Vi trenger ikke gå samtidig eller like langt. Ingen konkurranse – bare en uformell felles utfordring.';return `<div class="full-header"><div class="eyebrow">SAMMEN, MEN PÅ EGNE PREMISSER</div><h1>En venn kan gjøre terskelen lavere.</h1><p class="intro muted">Ikke alle motiveres av samme ting. Her prøver vi et lite, frivillig samarbeid i stedet for rangering etter hvem som går lengst.</p></div><div class="layout-two"><section class="card"><div class="eyebrow">UTFORSK VENNEFUNKSJONEN</div><h2>Et felles ukesoppdrag</h2><p class="muted sm">Målet er seks små bidrag fra gruppen. Hver person kan bidra med gjennomførte handlinger på sitt nivå.</p><div class="friend-lane"><span class="friend-face user">DU<span class="caption">Du</span></span><span class="friend-face">A<span class="caption">Venn A*</span></span><span class="friend-face">B<span class="caption">Venn B*</span></span></div><div style="height:16px"></div><div class="co-op-meter"><div class="muted-label">Felles bidrag</div><div class="map-track"><span style="width:${sum/6*100}%"></span></div><div class="sm"><b>${sum} av 6</b> · Dine: ${fromYou} · Demo-venner: ${demoOthers}</div></div><div class="divider"></div><p class="sm">${s.simulated?'Venn A og Venn B er oppdiktede demopersoner. Ingen andre er tilkoblet.':'Det er ingen andre deltakere her. Du kan aktivere en simulering for å se hvordan samarbeidet kunne fungert.'}</p><div class="btn-row"><button class="btn" type="button" data-action="toggle-demo">${s.simulated?'Skjul demo-venner':'Simuler to venner'}</button><button type="button" class="btn outline" data-action="copy-friend">Kopier en invitasjon</button></div><div class="copybox" style="margin-top:16px">«${e(message)}»</div><p class="fine">*Det sendes ingen invitasjon, og venner ser ingen av dataene dine i denne prototypen. Samarbeid er ikke knyttet til en ekte server.</p></section><aside class="stack"><section class="card"><h3>Hvorfor ikke en skrittliste?</h3><p class="sm muted">En deltaker med lite overskudd skal ikke konkurrere mot noen som allerede går 15 000 skritt daglig. Alle må kunne ha en meningsfull rolle, uten press om å holde tritt.</p></section><section class="card"><h3>Du kan også gjøre det alene</h3><p class="sm muted">Dette er bare ett av flere motivasjonsspor. Du kan ignorere vennemodus og bruke appen helt privat.</p><button class="btn secondary compact" type="button" data-view="today">Fortsett alene →</button></section></aside></div>`;}
function options(){return `<div class="full-header"><div class="eyebrow">DIN APP, DINE VALG</div><h1>En følgesvenn – bare hvis du vil.</h1><p class="intro muted">En maskot og et spill kan passe for noen, men irritere andre. Du skal enkelt kunne justere eller slå det av.</p></div><div class="layout-two"><section class="card"><div class="setting-row"><div><strong>Vis NIM-maskoten</strong><span>En liten figur som reagerer på egne valg, uten å straffe pauser.</span></div><button type="button" role="switch" aria-checked="${s.mascot}" aria-label="Vis NIM-maskoten" class="switch ${s.mascot?'on':''}" data-action="toggle-mascot"></button></div><div class="setting-row"><div><strong>Bruk vennemodus</strong><span>En frivillig demonstrasjon. Ingen virkelig deling i denne appen.</span></div><button type="button" role="switch" aria-checked="${s.group}" aria-label="Bruk vennemodus" class="switch ${s.group?'on':''}" data-action="toggle-group"></button></div><div class="divider"></div><h3>Hva vil du ha mer overskudd til?</h3><div class="inline-tools">${['Reiser og opplevelser','Mer energi i hverdagen','Familie og venner','Noe helt annet'].map(g=>`<button class="mode-btn ${s.goal===g?'active':''}" type="button" data-goal="${e(g)}">${e(g)}</button>`).join('')}</div><p class="sm muted">Du kan endre dette når du vil. Appen skal ikke gjøre interesser til en fast merkelapp.</p><div class="divider"></div><h3>Hva slags hjelp skal være standard?</h3><div class="inline-tools">${Object.entries(modeNames).map(([k,n])=>`<button type="button" class="mode-btn ${s.mode===k?'active':''}" data-mode="${k}">${e(n)}</button>`).join('')}</div><div class="divider"></div><div class="btn-row"><button class="btn outline" type="button" data-action="export">Eksporter lokale data</button><button class="btn secondary" type="button" data-action="clear">Slett og start på nytt</button></div><p class="fine">Ingen eksterne analysetjenester, kontooppretting eller reell kontakt med venner i denne prototypen.</p></section><aside class="stack"><section class="card help-card"><h3>Ingen plikt til å åpne appen</h3><p class="sm muted">Ingen daglige rekker, ingen tapte poeng, ingen varsel om at du skuffer figuren din. Ingen pushvarsler eller SMS er implementert.</p></section><section class="card"><h3>Designprinsippene</h3><p class="sm muted">Lekent, men voksent. Først en realistisk anledning, så en liten handling og til slutt en belønning. Ikke belønning for bare å trykke «Start».</p><p class="fine">Maskoten NIM og grensesnittet er originale konseptskisser. Navn og grafisk profil er ikke varemerkesjekket.</p></section></aside></div>`;}
function tabs(){document.querySelectorAll('[data-view]').forEach(el=>{el.classList.toggle('selected',el.dataset.view===s.view)})}
function save(){try{localStorage.setItem(KEY,JSON.stringify({...s,phase:'offer',toast:'',showWhy:false,simulated:false,lastVisit:now(),view:'today'}));}catch(e){}}
function render(){const root=$('app');if(!root)return;root.innerHTML=s.view==='today'?today():s.view==='journey'?journey():s.view==='together'?together():options();tabs();save();}
function goto(view){s.view=view;s.phase='offer';s.toast='';render();window.scrollTo({top:0,behavior:'instant'});}
function onAction(a){const o=offer();switch(a){
 case 'start':s.phase='started';break;
 case 'stop':s.phase='offer';s.toast='Det ble ikke registrert noe. Du kan prøve igjen når du vil.';break;
 case 'report':s.phase='report';s.minutes=String(o.duration||2);break;
 case 'back':s.phase='offer';break;
 case 'save-report':{let min=Number(s.minutes);if(!Number.isInteger(min)||min<1||min>120){s.toast='Velg en varighet mellom 1 og 120 minutter.';break;}s.session.push({title:o.title,kind:o.kind,minutes:min,feel:s.feel,time:now(),source:'egenrapport'});s.phase='offer';s.toast=`${min} minutter er registrert som egenrapportert aktivitet. Ett nytt glimt åpnet.`;break;}
 case 'plan':s.phase='plan';break;
 case 'save-plan':{const cue=$('cue')?.value||'Etter middag';s.plans.push({cue,action:o.title,time:now(),backup:'En enklere handling en annen dag'});s.phase='offer';s.toast='Avtalen er lagret – men den teller ikke som aktivitet og sender ingen varsler.';break;}
 case 'why':s.showWhy=!s.showWhy;break;
 case 'friends':goto('together');return;
 case 'rest':s.paused=true;s.phase='offer';s.toast='Du kan hvile uten å tape fremgang. Ingen aktivitet er registrert.';break;
 case 'toggle-mascot':s.mascot=!s.mascot;break;
 case 'toggle-group':s.group=!s.group;if(s.group){goto('together');return;}break;
 case 'toggle-demo':s.simulated=!s.simulated;break;
 case 'copy-friend':{const t='Har du lyst til å prøve en liten aktivitet sammen denne uka? Vi trenger ikke gå samtidig eller like langt. Ingen konkurranse – bare en uformell felles utfordring.';if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(()=>{s.toast='Invitasjonen er kopiert, men ikke sendt.';render()}).catch(()=>{s.toast='Kopiering er ikke tilgjengelig her. Du kan kopiere teksten manuelt.';render()});}else{s.toast='Kopiering krever sikker nettside eller nettleserstøtte. Du kan kopiere teksten manuelt.';}break;}
 case 'export':{const blob=new Blob([JSON.stringify({versjon:'4.1',tid:now(),...s},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='ikke-trening-4-1-data.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);s.toast='Dataeksport startet.';break;}
 case 'clear':if(confirm('Vil du slette dine lokale data i denne prototypen?')){localStorage.removeItem(KEY);s=defaults();s.toast='Lokale data er slettet fra appen.';}break;
 }render();}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-view],[data-reason],[data-mode],[data-action],[data-minute],[data-feel],[data-goal]');if(!t)return;const d=t.dataset;if(d.view){goto(d.view);}else if(d.reason){s.reason=d.reason;s.phase='offer';s.toast='';s.paused=false;render();}else if(d.mode){s.mode=d.mode;s.phase='offer';render();}else if(d.minute){s.minutes=d.minute;render();}else if(d.feel){s.feel=d.feel;render();}else if(d.goal){s.goal=d.goal;render();}else if(d.action)onAction(d.action);});
render();
})();

</script>
